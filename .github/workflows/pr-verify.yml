name: PR Verify

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    permissions:
      contents: read
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      test_report: ${{ steps.shared-tests-1.outputs.test-report }}
      integration_test_report: ${{ steps.integration-tests.outputs.report }}
    steps:
      - id: shared-tests-1
        uses: frasermolyneux/actions/dotnet-ci@a6271c58ed8e8f3b6fbdb738ac7566863fdc38c8 # dotnet-ci/v2.1.2
        with:
          test-reporting: "true"
          dotnet-version: |
            9.0.x
            10.0.x
          src-folder: "src"

      - name: Run integration tests
        id: integration-tests
        uses: frasermolyneux/actions/dotnet-test@b86f0707e0bf5bc7de100cd43351dcc3b8971914 # dotnet-test/v1.3.1
        with:
          suite: Integration
          project: MX.Api.IntegrationTests/MX.Api.IntegrationTests.csproj
          filter: ""
          artifact-name: test-results-Integration

  test-results:
    name: Test results summary
    if: always() && github.event.pull_request.draft == false
    needs: [build-and-test]
    permissions:
      pull-requests: write
    runs-on: ubuntu-latest
    concurrency:
      group: test-results-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: frasermolyneux/actions/test-results-summary@28f6613d746ec836d245f10259ea124897d8254a # test-results-summary/v1.1.0
        with:
          jobs: ${{ toJSON(needs) }}
