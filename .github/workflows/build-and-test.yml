name: Build and Test

on:
  push:
    branches:
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"

permissions: {}

jobs:
  build-and-test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: frasermolyneux/actions/dotnet-ci@a6271c58ed8e8f3b6fbdb738ac7566863fdc38c8 # dotnet-ci/v2.1.2
        with:
          test-reporting: "true"
          dotnet-version: |
            9.0.x
            10.0.x
          src-folder: "src"

      - name: Run integration tests
        uses: frasermolyneux/actions/dotnet-test@c4dcaf4142a2e56a5c50af52c7c9eb8c441ebfab # dotnet-test/v1.1.1
        with:
          suite: Integration
          project: MX.Api.IntegrationTests/MX.Api.IntegrationTests.csproj
          filter: ""
          artifact-name: test-results-Integration