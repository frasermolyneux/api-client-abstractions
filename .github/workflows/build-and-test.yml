name: Build and Test

on:
  push:
    branches:
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"

permissions: {}

jobs:
  build-and-test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: frasermolyneux/actions/dotnet-ci@dotnet-ci/v2.1
        with:
          test-reporting: "true"
          dotnet-version: |
            9.0.x
            10.0.x
          src-folder: "src"

      - name: Run integration tests
        uses: frasermolyneux/actions/dotnet-test@dotnet-test/v1
        with:
          suite: Integration
          project: MX.Api.IntegrationTests/MX.Api.IntegrationTests.csproj
          filter: ""
          artifact-name: test-results-Integration